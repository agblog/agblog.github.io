<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Automated Playlist</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            color: #ff0000;
            margin-bottom: 10px;
        }
        p {
            color: #aaaaaa;
            margin-bottom: 30px;
        }
        .playlist-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 25px;
            width: 100%;
            max-width: 1200px;
            margin-bottom: 40px;
        }
        .video-container {
            background-color: #1e1e1e;
            padding: 10px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
        }
        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
            height: 0;
            overflow: hidden;
            border-radius: 4px;
            background: #000;
        }
        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
        .video-title {
            margin-top: 12px;
            font-size: 14px;
            font-weight: bold;
            text-align: center;
            color: #e0e0e0;
            text-transform: capitalize;
        }
        .back-link {
            color: #aaaaaa;
            text-decoration: none;
            font-size: 16px;
            transition: color 0.3s;
            margin-top: 20px;
        }
        .back-link:hover {
            color: #ffffff;
        }
    </style>
</head>
<body>

    <h1>My Playlist</h1>
    <p>Automatically mapped using keyword triggers</p>

    <div class="playlist-grid" id="playlistGrid"></div>

    <a href="../" class="back-link">← Back to Homepage</a>

    <script>
        // Define your keyword terms exactly as requested
        const keywords = [
            "atif aslam tajdar e haram", "believer imagine dragons", "Kun Faya kun rockstar", 
            "faded alan walker", "ya ali gangster", "bad liar imagine dragons", 
            "koi fariyad", "see you again", "uska hi bana", "aayat bajirao mastani", 
            "kamin fireplace", "phir mohobbat", "gehra hua", "despacito", 
            "pasoori", "deewana kar rha hai", "marshmello happier", "ye tune kya kiya", 
            "numb linkin park", "let her go passenger", "guli mata", "apt rose bruno mars", 
            "Saad Lamjarred - LM3ALLEM", "Hymn for the weekend", "let me down slowly", 
            "Hoke ruposh", "tera mera hai pyar amar", "Ishq ki sajise", "Shiv kailasho ke wasi"
        ];

        const grid = document.getElementById('playlistGrid');

        // Dynamically build and map clean players using content parameters
        keywords.forEach((track, index) => {
            const container = document.createElement('div');
            container.className = 'video-container';

            const wrapper = document.createElement('div');
            wrapper.className = 'video-wrapper';

            const iframe = document.createElement('iframe');
            
            // Leveraging YouTube search keyword handling inside the target embed framework safely
            iframe.src = `https://youtube.com{encodeURIComponent(track)}&rel=0`;
            iframe.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture";
            iframe.setAttribute('allowfullscreen', 'true');

            const title = document.createElement('div');
            title.className = 'video-title';
            title.innerText = `${index + 1}. ${track}`;

            wrapper.appendChild(iframe);
            container.appendChild(wrapper);
            container.appendChild(title);
            grid.appendChild(container);
        });
    </script>
</body>
</html>
